name: "📝 Documentation"
title: "[DOCS] "
labels: ["documentation"]
body:
  - type: textarea
    id: description
    attributes:
      label: "description"
      description: "어떤 문서(README, API 명세 등)를 수정하나요?"
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: "scope"
      placeholder: "e.g. README.md, API-Docs"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "etc"