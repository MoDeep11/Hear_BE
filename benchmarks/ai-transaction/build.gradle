plugins { id 'java' }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework:spring-context:6.2.16'
    implementation 'org.springframework:spring-orm:6.2.16'
    implementation 'org.hibernate.orm:hibernate-core:6.6.42.Final'
    implementation 'com.zaxxer:HikariCP:6.3.3'
    runtimeOnly 'org.postgresql:postgresql:42.7.8'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}
sourceSets.main.java.srcDirs = ['src']
tasks.register('benchmark', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'AiTransactionBenchmark'
    workingDir = projectDir
}
