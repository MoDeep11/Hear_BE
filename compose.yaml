services:
  # 1. PostgreSQL 데이터베이스
  postgres:
    image: 'postgres:latest'
    container_name: postgres-db
    environment:
      POSTGRES_DB: hear
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432' # 외부에서도 접속 가능하도록 매핑
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - hear-network

  # 2. Redis 캐시/메시지 브로커
  redis:
    image: 'redis:latest'
    container_name: redis-cache
    ports:
      - '6379:6379'
    networks:
      - hear-network

  # 3. 코틀린 스프링 부트 애플리케이션
  app:
    build: .
    container_name: hear-app
    ports:
      - '8080:8080'
    environment:
      # DB 설정 (호스트를 서비스명인 'postgres'로 지정)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hear
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: secret
      # Redis 설정 (호스트를 서비스명인 'redis'로 지정)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - hear-network

networks:
  hear-network:
    driver: bridge